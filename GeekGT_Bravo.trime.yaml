# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: GeekGT_Bravo        # 方案名称（精简无ESC行版本）
author: lesca + 我          #作者信息

#键盘高度
#键盘高度
#界面风格、功能开关
style:
  auto_caps: false #自動句首大寫:true|false|ascii
  candidate_font: [LXGWWenKai-Medium.ttf]  #候选字体
  candidate_padding: 4  #候选项内边距
  candidate_spacing: 0.5  #候选间距
  candidate_text_size: 20  #候选字号
  candidate_view_height: 33 #候选区高度
  comment_font: [LXGWWenKai-Medium.ttf] #编码提示字体
  comment_height: 3 #编码提示区高度
  #candidate_text_vertical_bias: -1
  #comment_vertical_bias: -1
  comment_position: top
  comment_text_size: 12 #编码提示字号
  hanb_font: LXGWWenKai-Medium.ttf #扩充字体
  horizontal_gap: 4 #键水平间距
  vertical_gap: 4 #键盘行距
  key_border: 1
  key_font: [LXGWWenKai-Medium.ttf] #键盘字体
  key_height: 48 #键高
  key_hint_offset_x: 10 
  key_long_text_size: 16 #长标签字号
  key_text_size: 22 #键字号
  key_width: 10.0 #键宽，占屏幕宽的百分比
  label_text_size: 22 #标签字号
  label_font: label.ttf #编标签字体
  latin_font: latin.ttf #西文本体
  keyboard_height: 242 # 扣除ESC行(25)+底部留白(8)，保持前四行单键高度一致
  keyboard_height_land: 200 #锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_padding_bottom: 7 # 键盘底部距屏幕底部的留白高度(dp)，可根据手感自行微调
  keyboard_padding: 4
  key_symbol_offset_x: 10
  popup_font: [LXGWWenKai-Medium.ttf] #按键提示字体
  popup_width: 45 #按键提示宽度
  popup_height: 50 #按键提示高度
  popup_bottom_margin: 50 #按键提示底边距
  popup_key_height: 48 #按键提示内键高度
  popup_text_size: 23 #按键提示字号
  reset_ascii_mode_on_focus_change: false #显示键盘时重置为中文状态
  round_corner: 7 # Gboard 风格普通按键圆角
  shadow_radius: 0.2 #按键阴影半径
  symbol_font: [LXGWWenKai-Medium.ttf] #符号字体
  symbol_text_size: 10 #符号字号
  text_font: latin.ttf #编码字体
  enter_label_mode: 0  #是否使用App提供的ActionLabel内容作为Enter键的文本（由于多数App没有适配ActionLable，实际影响不大）。0不使用，1只使用actionlabel，2优先使用，3当其他方式没有获得label时才读取actionlabel
  enter_labels:  # 定义Enter键的文本
    go: ➢
    done: ➢
    next: ➢
    pre:  ➢
    search: ➢
    send: ➢
    default: ➢   # 定义默认Enter键的文本

preedit:                  # 预编辑文本视图参数
  horizontal_padding: 8     # 横向内边距（整数）
#  alpha: 0.8                 # 透明度（0-1，浮点）
  top_end_radius: 0         # 末上端圆角（浮点）
  foreground:               # 前景样式
    font_size: 16             # 预编辑字体大小（浮点）

window:               # 候选窗口（悬浮窗）参数
  insets:               # 窗口内边距
    vertical: 4           # 纵向内边距（整数）
    horizontal: 4         # 横向内边距（整数）
  item_padding:         # 候选项内边距
#    vertical: 0           # 纵向内边距（整数）
    horizontal: 4         # 横向内边距（整数）
#  min_width: 0          # 最小宽度（整数）
#  corner_radius: 0      # 圆角半径（浮点）
#  alpha: 1              # 透明度（0-1，浮点）
  foreground:           # 前景样式
    label_font_size: 20   # 序号字体大小（浮点）
    text_font_size: 20    # 文字字体大小（浮点）
    comment_font_size: 16  # 注释字体大小（浮点）

# 最好保留一项，防止其他主题使用 __include 时无法加载
fallback_colors:
  candidate_text_color: text_color
  popup_back_color: back_color
# 以下值是程序内置的，你也可以在这里自定义，这会覆盖默认值
