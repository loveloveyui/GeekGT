  geekgt_guide:
    label: "使用说明"
    commit: |
      【使用说明】
      1. 冒号放在了 M 键里面，左滑可以直接发送
      2. A 键下滑是全选后复制，发送消息之前可以先复制一份防止被吞
      3. 删除键支持左滑按住自由删除和恢复，上滑是清空全部
      4. 上下滑 J/K 发送成对儿的引号括号，长按菜单发送单独的引号括号
      5. B 键：上下左右滑是 Page Up/Down / Home/End
      6. N 键：上下左右滑是 ↑ ↓ ← →
      7. 下滑数字是发送“小键盘”的数字
      8. 长按数字键盘按钮是符号键盘
      9. 长按 Ctrl 弹出各种切换菜单
      10. 长按句号发送各种“点”，上滑发送逗号

