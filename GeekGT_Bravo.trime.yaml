tool_bar:
  button_spacing: 5 # 按钮间距
  button_font: iconfont.ttf # 按钮字体

  # 左侧固定主按钮配置
  primary_button: 
    # 背景样式设置
    background:
      type: circle           # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10      # 圆角半径
      normal: 0x00        # 正常状态背景颜色
      highlight: hilited_candidate_button_color  # 高亮状态背景色
      vertical_inset: 0      # 垂直方向内缩量
      horizontal_inset: 0    # 水平方向内缩量
    # 前景内容设置
    foreground:
     # style: "ic@microsoft" # 内置质感设计图标样式（以ic@开头），备选图标：
     # style: "ic@rhombus-split"
     # style: "ic@dots_horizontal"
     # style: "ic@dots-vertical"
      style: "ic@view-dashboard"
     # style: "ic@widgets"
     # style: "ic@widgets-outline"
      font_size: 11
      normal: candidate_text_color  # 正常状态前景色 (本地图片不允许着色)
      # highlight:        # 高亮状态前景色
      padding: 0            # 前景内容与背景边界的内边距
      # size: [120, 24]      # 视图控件宽高，非前景样式宽高
    # 按钮点击事件
    action: menu_keyboard

  hide_button: &hide_button
    foreground:
     # style: "ic@keyboard_close"
     # style: "ic@keyboard-close-outline"
      style: "ic@triangle-small-down"
      normal: candidate_text_color
      font_size: 8
    action: Hide
  
  edit_button: &edit_button
    foreground:
      style: "◂𝐈▸"
      font_size: 16
    action: Keyboard_numberb

  menu_button: &menu_button
    foreground:
      style: "？"
      font_size: 14
    action: Keyboard_func
    long_press_action: geekgt_guide

  clipboard_button: &clipboard_button
    foreground:
     # style: "ic@bookmark-multiple"
      style: "ic@bookmark-multiple-outline"
      font_size: 14
    action: clipboard_window

  search_button: &search_button
    foreground:
      style: "ic@magnify"
      font_size: 14
    action: Bing

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["中", "En"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 18  # 按钮字体大小
    action: Mode_switch

  paste_button: &paste_button
    foreground:
     # style: "ic@clipboard-text"
      style: "ic@clipboard-text-outline"
      font_size: 14
    action: paste

  undo_button: &undo_button
    foreground:
     # style: "ic@reply"
      style: "ic@undo"
      font_size: 14
    action: undo

  redo_button: &redo_button
    foreground:
     # style: "ic@share"
      style: "ic@redo"
      font_size: 14
    action: redo

  # 右侧按钮列表（从右向左排列）
  buttons: [ *hide_button, *menu_button, *clipboard_button, *edit_button, *ascii_mode_button, *redo_button, *undo_button ]

#键盘布局
preset_keyboards:
  default:
    author: "lesca"
    name: 26键默认布局
    width: 11.12
    #keyboard_height: 275
    ascii_mode: 0
    #ascii_keyboard: default_b
    #reset_ascii_mode: true
    lock: true
    #label_transform: lowercase   #键盘字母转化为小写
    keys:
      # 第零行
      - {height: 35, popup_height: 1, popup_bottom_margin: 1, click: "1-n", swipe_down: "KP_1", key_back_color: gd00, key_text_color: th1, width: 10}
      - {click: "2-n", swipe_down: "KP_2", key_back_color: gd01, key_text_color: th1, width: 10}
      - {click: "3-n", swipe_down: "KP_3", key_back_color: gd02, key_text_color: th1, width: 10}
      - {click: "4-n", swipe_down: "KP_4", key_back_color: gd03, key_text_color: th1, width: 10}
      - {click: "5-n", swipe_down: "KP_5", key_back_color: gd04, key_text_color: th1, width: 10}
      - {click: "6-n", swipe_down: "KP_6", key_back_color: gd04, key_text_color: th1, width: 10}
      - {click: "7-n", swipe_down: "KP_7", key_back_color: gd05, key_text_color: th1, width: 10}
      - {click: "8-n", swipe_down: "KP_8", key_back_color: gd06, key_text_color: th1, width: 10}
      - {click: "9-n", swipe_down: "KP_9", key_back_color: gd07, key_text_color: th1, width: 10}
      - {click: "0-n", swipe_down: "KP_0", key_back_color: gd08, key_text_color: th1, width: 10}


      #  第一行
      - {click: q, popup: ["Q", "F1-p", "1-p", "¡","¶"], label_symbol: '!', swipe_up: '!', hint: '※',swipe_down: '※',key_back_color: gd03, key_text_color: th1, width: 10}
      - {click: w, popup: ["W", "F2-p", "2-p"], hint: '@', swipe_down: '@', label_symbol: '〒',swipe_up: '〒',key_back_color: gd04, key_text_color: th1, width: 10}
      - {click: e, popup: ["E", "F3-p", "3-p"], hint: '#', swipe_down: '#', key_back_color: gd05, key_text_color: th1, width: 10}
      - {click: r, popup: ["R", "F4-p", "4-p", "¥"], hint: '$', swipe_down: '$', key_back_color: gd05, key_text_color: th1, width: 10}
      - {click: t, popup: ["T", "F5-p", "5-p", "‰", "‱"], hint: '%', swipe_down: '%', key_back_color: gd06, key_text_color: th1, width: 10}
      - {click: y, popup: ["Y", "F6-p", "6-p"], hint: '^', swipe_down: '^', key_back_color: gd07, key_text_color: th1, width: 10}
      - {click: u, popup: ["U", "F7-p", "7-p"],label_symbol: '?',swipe_up: '❓',hint: '&', swipe_down: '&', key_back_color: gd08, key_text_color: th1, width: 10}
      - {click: i, popup: ["I", "F8-p", "8-p", "★", "☆"], label_symbol: '✓',swipe_up: '✅', hint: '✕',swipe_down: '❌', key_back_color: gd09, key_text_color: th1, width: 10}
      - {click: o, popup: ["O", "F9-p", "wxsj", "wxrq"],  key_back_color: gd10, key_text_color: th1, width: 10}
      - {click: p, popup: ["P", "F10-p", "0-p"],  key_back_color: gd11, key_text_color: th1, width: 10}
      
      
      #  第二行
      - {width: 5, key_back_color: bh2, key_text_color: th2}
      - {width: 10, click: a, popup: ["A", "A", "·", "~", "﹋", " "],label_symbol: '~',swipe_up: '~', hint: '❏', swipe_down: 'CopyAll', key_back_color: gd06, key_text_color: th2}
      #- {width: 10, click: s, popup: ["S", "+", "±", "=", "≠", "≈"], label_symbol: '+', swipe_up: '+', hint: '=', swipe_down: '=', key_back_color: bh2, key_text_color: th2}
      #- {width: 10, click: d, popup: ["D", "underdash-p", "-", "——"], label_symbol: '_', swipe_up: '_', hint: '-', swipe_down: '-', key_back_color: bh2, key_text_color: th2}
